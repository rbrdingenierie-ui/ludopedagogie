  function wireQuiz(panel) {
    const elQuestion = panel.querySelector('#quizQuestion');
    const elConsigne = panel.querySelector('#quizConsigne');
    const elManettes = panel.querySelector('#quizManettes');
    const elCompteur = panel.querySelector('#quizCompteur');
    const elSerie = panel.querySelector('#quizSerie');
    const elJauge = panel.querySelector('#quizJauge');
    const elConfiance = panel.querySelector('#quizConfiance');
    const elVerdict = panel.querySelector('#quizVerdict');
    const elJeu = panel.querySelector('#quizJeu');
    const elBilan = panel.querySelector('#quizBilan');

    let ordre = [], pos = 0, justes = 0, serie = 0, meilleureSerie = 0, curseur = 0;
    let minuterieSuite = null;
    let erreurs = [], reponses = [], choixEnCours = null, confianceEnCours = null;


    // ---- les sons du quiz ----
    // Deux fichiers a deposer a cote de la page. S'ils manquent, le quiz
    // fonctionne en silence, sans erreur.
    const SON_JUSTE = 'quiz-juste.mp3';
    const SON_FAUX  = 'quiz-faux.mp3';

    function sonCoupe() {
      try { return sessionStorage.getItem('accueil-son-coupe-session') === '1'; }
      catch (e) { return false; }
    }
    function jouerSonReponse(bon) {
      if (sonCoupe()) return;
      try {
        const a = new Audio(bon ? SON_JUSTE : SON_FAUX);
        a.volume = bon ? 0.4 : 0.32;
        a.play().catch(() => { /* lecture auto bloquee : sans consequence */ });
      } catch (e) { /* fichier absent : on ignore */ }
    }

    function melanger(t) {
      const a = t.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function demarrer(indices) {
      // annuler un passage a la question suivante encore en attente
      if (minuterieSuite) { clearTimeout(minuterieSuite); minuterieSuite = null; }
      ordre = indices || QUIZ_DATA.map((_, i) => i);
      pos = 0; justes = 0; serie = 0; meilleureSerie = 0;
      erreurs = []; reponses = [];
      elJeu.hidden = false; elBilan.hidden = true;
      afficher();
    }

    function afficher() {
      const q = QUIZ_DATA[ordre[pos]];
      choixEnCours = null; confianceEnCours = null;

      elCompteur.textContent = 'Question ' + (pos + 1) + ' sur ' + ordre.length;
      const pct = Math.round((pos / ordre.length) * 100);
      elJauge.style.width = pct + '%';
      elJauge.parentElement.setAttribute('aria-valuenow', pct);

      if (serie >= 3) {
        elSerie.hidden = false;
        elSerie.textContent = '🔥 Série de ' + serie;
      } else { elSerie.hidden = true; }

      elQuestion.textContent = q.q;
      elConsigne.innerHTML = document.body.classList.contains('falc-mode')
        ? 'Bouge le joystick pour choisir.<br>Appuie sur le bouton vert pour valider.'
        : '🕹️ Joystick pour choisir · 🟢 bouton vert pour valider';
      elVerdict.hidden = true;
      elConfiance.hidden = true;

      // les propositions sont melangees : la bonne ne doit pas etre toujours en tete
      const props = melanger([q.bonne].concat(q.autres));
      elManettes.innerHTML = '';
      props.forEach((texte, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'quiz-manette ' + COULEURS_MANETTE[i];
        b.setAttribute('aria-label', 'Réponse ' + LETTRES[i] + ' : ' + texte);
        b.innerHTML = '<span class="quiz-pastille" aria-hidden="true">' + LETTRES[i] + '</span>'
                    + '<span>' + escapeHtml(texte) + '</span>';
        b.addEventListener('click', () => choisir(texte, b));
        b.addEventListener('focus', () => { curseur = i; marquerCurseur(); });
        elManettes.appendChild(b);
      });
      curseur = 0;
      marquerCurseur();
    }

    // Le curseur suit le joystick : une proposition est toujours en surbrillance,
    // et les boutons de la console la valident. C'est le geste d'une vraie borne.
    function marquerCurseur() {
      const bs = elManettes.querySelectorAll('.quiz-manette');
      bs.forEach((b, i) => b.classList.toggle('visee', i === curseur && !choixEnCours));
    }

    function deplacerCurseur(pas) {
      if (choixEnCours) return;
      const bs = elManettes.querySelectorAll('.quiz-manette');
      if (!bs.length) return;
      curseur = (curseur + pas + bs.length) % bs.length;
      marquerCurseur();
      // le lecteur d'ecran annonce la proposition visee
      if (typeof annoncerJeu === 'function') {
        annoncerJeu(bs[curseur].getAttribute('aria-label'));
      }
      const tige = panel.querySelector('#quizJoyTige');
      if (tige) {
        tige.style.transform = 'rotate(' + (pas > 0 ? 14 : -14) + 'deg)';
        setTimeout(() => { tige.style.transform = ''; }, 260);
      }
    }

    function validerCurseur() {
      if (choixEnCours) return;
      const bs = elManettes.querySelectorAll('.quiz-manette');
      if (bs[curseur]) bs[curseur].click();
    }

    // L'apprenant choisit, puis dit s'il etait sur. On ne devoile qu'ensuite :
    // c'est ce decalage qui rend visible l'effet Dunning-Kruger.
    function choisir(texte, bouton) {
      if (choixEnCours) return;
      choixEnCours = { texte: texte, bouton: bouton };
      elManettes.querySelectorAll('.quiz-manette').forEach(b => {
        b.disabled = true;
        if (b !== bouton) b.classList.add('eteinte');
      });
      elConsigne.textContent = 'Réponse enregistrée';
      elConfiance.hidden = false;
      const premier = elConfiance.querySelector('button');
      if (premier) setTimeout(() => premier.focus(), 60);
    }

    elConfiance.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        confianceEnCours = b.dataset.sur === '1';
        elConfiance.hidden = true;
        devoiler();
      });
    });

    function devoiler() {
      const q = QUIZ_DATA[ordre[pos]];
      const bon = choixEnCours.texte === q.bonne;

      elManettes.querySelectorAll('.quiz-manette').forEach(b => {
        b.classList.remove('eteinte');
        const t = b.querySelector('span:last-child').textContent;
        if (t === q.bonne) b.classList.add('juste');
        else if (b === choixEnCours.bouton) b.classList.add('fausse');
        else b.classList.add('eteinte');
      });

      if (bon) {
        justes++; serie++;
        if (serie > meilleureSerie) meilleureSerie = serie;
      } else {
        serie = 0;
        erreurs.push(ordre[pos]);
      }
      reponses.push({ juste: bon, sur: confianceEnCours });

      jouerSonReponse(bon);

      // Ludo marque le coup : il se rejouit ou fronce les sourcils
      const ecran = panel.querySelector('.quiz-ecran');
      ecran.classList.remove('ludo-content', 'ludo-decu');
      void ecran.offsetWidth;
      ecran.classList.add(bon ? 'ludo-content' : 'ludo-decu');
      setTimeout(() => ecran.classList.remove('ludo-content', 'ludo-decu'), bon ? 1500 : 2400);

      elVerdict.hidden = false;
      elVerdict.textContent = bon
        ? (confianceEnCours ? '✅ Bonne réponse, et tu le savais !' : '✅ Bonne réponse — tu en savais plus que tu ne croyais.')
        : (confianceEnCours ? '❌ Raté. La bonne réponse : ' + q.bonne + '. Une certitude peut tromper.'
                            : '❌ Raté. La bonne réponse : ' + q.bonne + '.');
      elConsigne.textContent = '';

      minuterieSuite = setTimeout(() => {
        minuterieSuite = null;
        pos++;
        if (pos >= ordre.length) terminer();
        else afficher();
      }, bon ? 1600 : 2900);
    }

    function terminer() {
      elJeu.hidden = true;
      elBilan.hidden = false;
      const total = ordre.length;
      const pct = Math.round((justes / total) * 100);

      panel.querySelector('#quizBilanScore').textContent = justes + ' / ' + total;

      let mot;
      if (pct === 100) mot = '🏆 Sans faute ! Tu maîtrises tout le cours.';
      else if (pct >= 80) mot = '👏 Très solide. Quelques notions à revoir, rien de plus.';
      else if (pct >= 50) mot = '🌱 Bonne base. Les erreurs te montrent exactement quoi travailler.';
      else mot = '💪 Le cours mérite un second passage — et c\'est normal, c\'est ainsi qu\'on apprend.';
      if (meilleureSerie >= 3) mot += ' Ta plus longue série : ' + meilleureSerie + ' d\'affilée.';
      panel.querySelector('#quizBilanMot').textContent = mot;

      // La lucidite : l'ecart entre ce qu'on croit savoir et ce qu'on sait.
      // C'est la notion de la sequence Dunning-Kruger, vecue plutot que lue.
      let surJustes = 0, surFausses = 0, hesiteJustes = 0, hesiteFausses = 0;
      reponses.forEach(r => {
        if (r.sur && r.juste) surJustes++;
        else if (r.sur && !r.juste) surFausses++;
        else if (!r.sur && r.juste) hesiteJustes++;
        else hesiteFausses++;
      });
      let lucidite = '<strong>Ta lucidité</strong><br>';
      lucidite += '💪 Sûr·e et juste : ' + surJustes + ' &nbsp;·&nbsp; ';
      lucidite += '💪 Sûr·e mais faux : ' + surFausses + '<br>';
      lucidite += '🤔 Hésitant·e et juste : ' + hesiteJustes + ' &nbsp;·&nbsp; ';
      lucidite += '🤔 Hésitant·e et faux : ' + hesiteFausses + '<br><br>';
      if (surFausses > hesiteJustes && surFausses >= 2) {
        lucidite += 'Tu as été sûr·e de toi ' + surFausses + ' fois à tort : c\'est exactement l\'effet Dunning-Kruger. Se tester régulièrement est le meilleur remède.';
      } else if (hesiteJustes > surFausses && hesiteJustes >= 2) {
        lucidite += 'Tu as douté ' + hesiteJustes + ' fois alors que tu savais. Tu en sais plus que tu ne le crois — fais-toi confiance.';
      } else {
        lucidite += 'Ta confiance colle plutôt bien à tes résultats : c\'est le signe d\'une bonne métacognition.';
      }
      panel.querySelector('#quizBilanLucidite').innerHTML = lucidite;

      const btnErreurs = panel.querySelector('#quizRejouerErreurs');
      btnErreurs.hidden = erreurs.length === 0;
      btnErreurs.textContent = '🔁 Rejouer mes ' + erreurs.length + ' erreur' + (erreurs.length > 1 ? 's' : '');

      // le badge de participation, puis celui du sans-faute
      if (typeof signalerJeuReussi === 'function') {
        signalerJeuReussi('quiz');
        if (justes === QUIZ_DATA.length) signalerJeuReussi('quiz-parfait');
      }
      if (typeof annoncerJeu === 'function') {
        annoncerJeu('Quiz terminé : ' + justes + ' bonnes réponses sur ' + total + '.');
      }
    }




    // La consigne est ecrite en JavaScript : il faut la reecrire quand
    // l'apprenant bascule en mode FALC, sinon elle garde l'ancienne version.
    (function suivreFalc() {
      const obs = new MutationObserver(() => {
        if (choixEnCours) return;
        elConsigne.innerHTML = document.body.classList.contains('falc-mode')
          ? 'Bouge le joystick pour choisir.<br>Appuie sur le bouton vert pour valider.'
          : '🕹️ Joystick pour choisir · 🟢 bouton vert pour valider';
      });
      obs.observe(document.body, { attributes: true, attributeFilter: ['class'] });
    })();

    // ---- les trois vues du quiz ----
    panel.querySelectorAll('.quiz-sous-btn').forEach(b => {
      b.addEventListener('click', () => {
        const vue = b.dataset.vue;
        panel.querySelectorAll('.quiz-sous-btn').forEach(x => {
          const actif = x.dataset.vue === vue;
          x.classList.toggle('active', actif);
          x.setAttribute('aria-selected', actif ? 'true' : 'false');
        });
        panel.querySelectorAll('.quiz-vue').forEach(v => {
          v.hidden = v.id !== 'quiz-vue-' + vue;
        });
      });
    });

    // ---- la console de Ludo pilote le quiz ----
    const joy = panel.querySelector('#quizJoystick');
    if (joy) {
      joy.addEventListener('click', () => deplacerCurseur(1));
      joy.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); deplacerCurseur(1); }
        else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); deplacerCurseur(1); }
        else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); deplacerCurseur(-1); }
      });
    }
    // Chaque bouton de la console a son role : vert pour valider,
    // jaune pour changer de question, rouge pour tout reprendre.
    function actionBouton(role) {
      if (role === 'valider') { validerCurseur(); return; }
      if (role === 'passer')  { passerQuestion(); return; }
      if (role === 'reinit')  { demanderReinit(); return; }
    }

    // Passer une question la renvoie en fin de parcours : elle sera posee,
    // mais plus tard. Rien n'est esquive.
    function passerQuestion() {
      if (choixEnCours) {
        if (typeof annoncerJeu === 'function') {
          annoncerJeu('Tu as déjà répondu à cette question.');
        }
        return;
      }
      if (ordre.length < 2) return;
      if (minuterieSuite) { clearTimeout(minuterieSuite); minuterieSuite = null; }
      const courante = ordre.splice(pos, 1)[0];
      ordre.push(courante);
      if (pos >= ordre.length) pos = 0;
      afficher();
      if (typeof annoncerJeu === 'function') {
        annoncerJeu('Question reportée. Elle reviendra plus tard.');
      }
    }

    function demanderReinit() {
      const ok = window.confirm(
        'Recommencer le quiz depuis la première question ?\n\n'
        + 'Ta progression en cours sera perdue.');
      if (ok) demarrer(null);
    }

    panel.querySelectorAll('.quiz-bouton-zone').forEach(z => {
      const role = z.dataset.role;
      z.addEventListener('click', () => actionBouton(role));
      z.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); actionBouton(role); }
      });
    });

    panel.querySelector('#quizRejouerErreurs').addEventListener('click', () => demarrer(erreurs.slice()));
    panel.querySelector('#quizRecommencer').addEventListener('click', () => demarrer(null));

    demarrer(null);
  }

  buildCrosswordPanel();
  buildMatchingTab();
  buildMemoryPanel();
  buildSortingPanel();
  buildTrousPanel();
  buildQuizPanel();

  // Un lien peut demander un onglet precis, par exemple depuis l'Arcade :
  // .../ludopedagogie/#quiz ouvre directement le quiz.
  (function ouvrirOngletDemande() {
    var demande = (window.location.hash || '').replace('#', '');
    if (!demande) return;
    var bouton = document.querySelector('.tab-btn[data-tab="' + demande + '"]');
    if (bouton) {
      activateTab(demande);
      // amener la borne a l'ecran sans brusquer la lecture
      setTimeout(function () {
        var p = document.getElementById('panel-' + demande);
        if (p) p.scrollIntoView({ block: 'start', behavior: 'auto' });
      }, 120);
    }
  })();
})();
</script>

<script>
// ============================================================
//  SUIVI DES JEUX REUSSIS
//  Chaque jeu termine est note ici. La page Arcade lit ces
//  informations pour attribuer les badges correspondants.
//  Les deux pages etant sur le meme domaine, elles partagent
//  le meme espace de stockage.
//
//  POUR UN AUTRE COURS : changez JEUX_ID, ici et dans arcade.html.
// ============================================================
var JEUX_ID = "apprendre-a-apprendre";
var CLE_JEUX = "arcade-jeux-" + JEUX_ID;

function signalerJeuReussi(id) {
  try {
    var brut = localStorage.getItem(CLE_JEUX);
    var faits = brut ? JSON.parse(brut) : [];
    if (!Array.isArray(faits)) faits = [];
    if (faits.indexOf(id) !== -1) return;      // deja note
    faits.push(id);
    localStorage.setItem(CLE_JEUX, JSON.stringify(faits));
    annoncerReussite(id);
  } catch (e) { /* stockage indisponible : sans consequence */ }
}

// Salue la reussite, a l'ecran et pour les lecteurs d'ecran.
function annoncerReussite(id) {
  var noms = {
    xword: "Mots croisés", matching: "Appariement", memory: "Memory",
    sorting: "Tri par tiroirs", trous: "Textes à trous", quiz: "Quiz", "quiz-parfait": "Quiz — sans faute"
  };
  var zone = document.getElementById("annonceJeu");
  var texte = "🎉 Bravo ! Tu as terminé « " + (noms[id] || id) + " ». Ton badge t'attend à l'Arcade.";
  if (zone) { zone.textContent = ""; setTimeout(function () { zone.textContent = texte; }, 60); }

  var bandeau = document.getElementById("bandeauReussite");
  if (!bandeau) {
    bandeau = document.createElement("div");
    bandeau.id = "bandeauReussite";
    bandeau.className = "bandeau-reussite";
    bandeau.setAttribute("role", "status");
    document.body.appendChild(bandeau);
  }
  bandeau.textContent = texte;
  bandeau.classList.add("visible");
  clearTimeout(annoncerReussite._t);
  annoncerReussite._t = setTimeout(function () { bandeau.classList.remove("visible"); }, 4500);
}


(function () {
  const A11Y_PREFS_KEY = 'menu-ressources-a11y-prefs-v1';
  let a11yPrefs = { font: false, contrast: false, scale: 1, falc: false, hoverRead: false, animAllegee: false };
  try {
    const raw = localStorage.getItem(A11Y_PREFS_KEY);
    if (raw) a11yPrefs = Object.assign(a11yPrefs, JSON.parse(raw));
  } catch (e) {}
  function saveA11yPrefs() {
    try { localStorage.setItem(A11Y_PREFS_KEY, JSON.stringify(a11yPrefs)); } catch (e) {}
  }
  function applyA11yPrefs() {
    document.body.classList.toggle('a11y-font', a11yPrefs.font);
    document.body.classList.toggle('a11y-contrast', a11yPrefs.contrast);
    document.body.classList.toggle('falc-mode', a11yPrefs.falc);
    document.documentElement.style.setProperty('--a11y-scale', a11yPrefs.scale);
    document.getElementById('a11yFontBtn').setAttribute('aria-pressed', a11yPrefs.font ? 'true' : 'false');
    document.getElementById('a11yContrastBtn').setAttribute('aria-pressed', a11yPrefs.contrast ? 'true' : 'false');
    document.getElementById('falcModeBtn').setAttribute('aria-pressed', a11yPrefs.falc ? 'true' : 'false');
    document.getElementById('hoverReadBtn').setAttribute('aria-pressed', a11yPrefs.hoverRead ? 'true' : 'false');
    document.body.classList.toggle('anim-allegee', a11yPrefs.animAllegee);
    const bA = document.getElementById('animAllegeeBtn');
    if (bA) bA.setAttribute('aria-pressed', a11yPrefs.animAllegee ? 'true' : 'false');
  }
  document.getElementById('a11yFontBtn').addEventListener('click', () => {
    a11yPrefs.font = !a11yPrefs.font;
    applyA11yPrefs(); saveA11yPrefs();
  });
  document.getElementById('a11yContrastBtn').addEventListener('click', () => {
    a11yPrefs.contrast = !a11yPrefs.contrast;
    applyA11yPrefs(); saveA11yPrefs();
  });
  document.getElementById('falcModeBtn').addEventListener('click', () => {
    a11yPrefs.falc = !a11yPrefs.falc;
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    applyA11yPrefs(); saveA11yPrefs();
  });
  document.getElementById('hoverReadBtn').addEventListener('click', () => {
    a11yPrefs.hoverRead = !a11yPrefs.hoverRead;
    if (!a11yPrefs.hoverRead && window.speechSynthesis) window.speechSynthesis.cancel();
    applyA11yPrefs(); saveA11yPrefs();
  });

  // ---- bouton "alleger les animations" ----
  // Le reglage vaut pour toutes les pages : il est memorise avec les autres
  // preferences d'accessibilite.
  const btnAnimAllegee = document.getElementById('animAllegeeBtn');
  if (btnAnimAllegee) {
    btnAnimAllegee.addEventListener('click', () => {
      a11yPrefs.animAllegee = !a11yPrefs.animAllegee;
      applyA11yPrefs(); saveA11yPrefs();
    });
  }

  document.getElementById('a11ySizeUp').addEventListener('click', () => {
    a11yPrefs.scale = Math.min(1.6, Math.round((a11yPrefs.scale + 0.15) * 100) / 100);
    applyA11yPrefs(); saveA11yPrefs();
  });
  document.getElementById('a11ySizeDown').addEventListener('click', () => {
    a11yPrefs.scale = Math.max(0.85, Math.round((a11yPrefs.scale - 0.15) * 100) / 100);
    applyA11yPrefs(); saveA11yPrefs();
  });
  document.getElementById('a11ySizeReset').addEventListener('click', () => {
    a11yPrefs.scale = 1;
    applyA11yPrefs(); saveA11yPrefs();
  });
  applyA11yPrefs();
  // ---- barre d'accessibilite figee au defilement ----
  // Elle reste atteignable a tout moment : un apprenant qui a besoin d'agrandir le texte
  // ne doit pas avoir a remonter en haut de page pour le faire.
  (function figerBarreA11y() {
    const barre = document.getElementById('a11yBar');
    const espace = document.getElementById('a11yBarEspace');
    if (!barre || !espace) return;

    let hauteurBarre = 0;
    let positionDeclenchement = 0;

    function mesurer() {
      // mesure faite hors etat fige, sinon la position serait faussee
      if (barre.classList.contains('figee')) return;
      hauteurBarre = barre.offsetHeight;
      positionDeclenchement = barre.getBoundingClientRect().top + window.scrollY;
    }

    function verifier() {
      if (window.scrollY > positionDeclenchement) {
        if (!barre.classList.contains('figee')) {
          espace.style.height = hauteurBarre + 'px';
          espace.classList.add('actif');
          barre.classList.add('figee');
        }
      } else if (barre.classList.contains('figee')) {
        barre.classList.remove('figee');
        espace.classList.remove('actif');
        mesurer();
      }
    }

    mesurer();
    window.addEventListener('scroll', verifier, { passive: true });
    window.addEventListener('resize', () => {
      // au redimensionnement, la barre change de hauteur : on remesure a froid
      const etaitFigee = barre.classList.contains('figee');
      barre.classList.remove('figee');
      espace.classList.remove('actif');
      mesurer();
      if (etaitFigee) verifier();
    });
  })();

  // ---- lecture au survol, sur l'integralite de la page ----
  function getVisibleHoverText(el) {
    const isFalc = document.body.classList.contains('falc-mode');
    if (isFalc && el.closest('.falc-normal-content')) return '';
    if (!isFalc && el.closest('.falc-simple-content')) return '';
    const clone = el.cloneNode(true);
    clone.querySelectorAll(isFalc ? '.falc-normal-content' : '.falc-simple-content').forEach(n => n.remove());
    return clone.textContent.replace(/\s+/g, ' ').trim();
  }
  if ('speechSynthesis' in window) {
    const HOVER_READ_SELECTOR = 'h1, h2, .page-tab-btn, .account-tab, label, .connection-tip, .account-hint, p, .a11y-toggle-btn, .a11y-bar-label, .forgot-link, .reset-message, .account-submit, .a11y-size-group button';
    document.querySelectorAll(HOVER_READ_SELECTOR).forEach(el => {
      el.addEventListener('mouseenter', () => {
        if (!a11yPrefs.hoverRead) return;
        window.speechSynthesis.cancel();
        const text = getVisibleHoverText(el);
        if (!text) return;
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'fr-FR'; utter.rate = 0.95;
        window.speechSynthesis.speak(utter);
      });
      el.addEventListener('mouseleave', () => { if (window.speechSynthesis) window.speechSynthesis.cancel(); });
      el.addEventListener('focusin', () => { if (a11yPrefs.hoverRead) el.dispatchEvent(new Event('mouseenter')); });
      el.addEventListener('focusout', () => { if (window.speechSynthesis) window.speechSynthesis.cancel(); });
    });
  }

  // ---- afficher / masquer le mot de passe ----
  // ---- retour immediat sur la correspondance des mots de passe ----
  const champMdp = document.getElementById('signupPassword');
  const champConfirm = document.getElementById('signupPasswordConfirm');
  const messageMatch = document.getElementById('passwordMatch');
  if (champMdp && champConfirm && messageMatch) {
    function verifierCorrespondance() {
      if (!champConfirm.value) { messageMatch.textContent = ''; messageMatch.className = 'password-match'; return; }
      const identiques = champMdp.value === champConfirm.value;
      messageMatch.textContent = identiques ? '✅ Les mots de passe correspondent' : '⚠️ Les mots de passe sont différents';
      messageMatch.className = 'password-match ' + (identiques ? 'ok' : 'erreur');
    }
    champMdp.addEventListener('input', verifierCorrespondance);
    champConfirm.addEventListener('input', verifierCorrespondance);
  }

  document.querySelectorAll('.password-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      if (!input) return;
      const visible = input.type === 'text';
      input.type = visible ? 'password' : 'text';
      btn.textContent = visible ? '👁️' : '🙈';
      btn.setAttribute('aria-label', visible ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
      btn.setAttribute('aria-pressed', visible ? 'false' : 'true');
    });
  });
})();


// ---- les jeux annoncent leurs resultats aux lecteurs d'ecran ----
// Sans cela, un apprenant non-voyant ne sait pas si sa reponse est juste.
(function () {
  var zone = document.getElementById('annonceJeu');
  if (!zone) return;

  window.annoncerJeu = function (texte) {
    zone.textContent = '';
    setTimeout(function () { zone.textContent = texte; }, 60);
  };

  // on surveille les retours visuels : quand une classe de reussite ou
  // d'erreur apparait, on l'annonce aussi a la voix
  var observateur = new MutationObserver(function (mutations) {
    mutations.forEach(function (m) {
      if (m.type !== 'attributes' || m.attributeName !== 'class') return;
      var cl = String(m.target.getAttribute('class') || '');
      var texte = (m.target.textContent || '').trim().slice(0, 60);
      if (/\b(juste|correct|reussi|valide|trouve|success|ok-rep)\b/i.test(cl)) {
        window.annoncerJeu('Bonne réponse. ' + texte);
      } else if (/\b(faux|erreur|incorrect|rate|wrong|ko-rep)\b/i.test(cl)) {
        window.annoncerJeu('Réponse incorrecte. ' + texte);
      }
    });
  });
  observateur.observe(document.body, { attributes: true, subtree: true, attributeFilter: ['class'] });
})();
</script>
